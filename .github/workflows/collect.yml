name: caiji

on:
  schedule:
    - cron: '*/15 0-12 * * 1-5'   # 工作日北京时间 08:00-20:45, 每 15 分钟
    - cron: '7 */2 * * *'         # 其余时间每 2 小时一次
  workflow_dispatch:

concurrency:
  group: caiji
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install requests oss2

      - name: run collector
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_KEY: hotspot/hotspots.db
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          XQ_COOKIE: ${{ secrets.XQ_COOKIE }}
        run: python collect.py
