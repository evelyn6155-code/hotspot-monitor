<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经热点监测</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1c2026; --sub:#6b7380; --line:#e6e8ec;
  --accent:#c8321e; --new:#d4380d; --tab:#eceef2;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171c; --card:#1c2026; --text:#e8eaee; --sub:#98a0ad; --line:#2a2f37; --accent:#ff6a55; --new:#ff7a45; --tab:#252a32;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:18px}
#updated{color:var(--sub);font-size:12px}
#tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;border:0;background:var(--tab);color:var(--text);padding:6px 14px;border-radius:16px;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
#subs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
#subs:empty,#subs2:empty{display:none}
#subs2{display:flex;gap:6px;margin-top:4px;overflow-x:auto}
.sub-tab{flex:none;border:0;border-bottom:2px solid transparent;background:none;color:var(--sub);padding:4px 10px;font-size:13px;cursor:pointer}
.sub-tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:860px;margin:0 auto;padding:12px 16px 40px}
.meta{color:var(--sub);font-size:12px;margin:4px 2px 10px}
ol{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
li{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.rk{flex:none;width:26px;text-align:center;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:1px}
li.ranked:nth-child(-n+3) .rk{color:var(--accent);font-weight:700}
.bd{flex:1;min-width:0}
.bd a{color:var(--text);text-decoration:none;word-break:break-word}
.bd a:hover{text-decoration:underline}
.sub{color:var(--sub);font-size:12px;margin-top:2px}
.badge{display:inline-block;background:var(--new);color:#fff;font-size:11px;padding:0 5px;border-radius:3px;margin-left:6px;vertical-align:1px}
.empty,.err{color:var(--sub);text-align:center;padding:40px 0}

.rk{border-radius:5px;width:24px;height:24px;line-height:24px;padding:0;font-size:13px;flex:none}
.rk.r1{background:#e5322d;color:#fff}.rk.r2{background:#f7731c;color:#fff}.rk.r3{background:#f5a623;color:#fff}
li.ranked:nth-child(-n+3) .rk{font-weight:700}
.hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.nm{flex:1;min-width:0}
.nmt{font-size:16px;font-weight:600}
.cd{color:var(--sub);font-size:12px;margin-top:1px;font-variant-numeric:tabular-nums}
.lu{display:inline-block;margin-top:3px;font-size:11px;padding:0 5px;border:1px solid #e5322d;color:#e5322d;border-radius:3px}
.rc,.ld{flex:none;text-align:right;font-variant-numeric:tabular-nums;min-width:68px}
.pc{font-size:16px;font-weight:600}.pr{font-size:12px;color:var(--sub);margin-top:1px}
.ld{font-size:13px;min-width:84px}.ld .pc{font-size:14px}
.up{color:#e5322d}.dn{color:#1a9d58}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;padding:1px 7px;border-radius:4px;background:#e8f0fb;color:#2a6cc4}
.chip.feat{background:#fdebe3;color:#d9541e}
a.news{display:block;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--tab);font-size:12px;color:var(--sub);line-height:1.55;text-decoration:none}
a.news:hover{text-decoration:none;filter:brightness(.97)}
.news b{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:11px;padding:0 6px;border-radius:3px;margin-right:6px;font-style:italic}
.news .nt{color:var(--text);font-size:13px}
.news .sm{margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<header>
  <div class="top"><h1>财经热点监测</h1><span id="updated">加载中…</span></div>
  <div id="tabs"></div>
  <div id="subs"></div>
  <div id="subs2"></div>
</header>
<main>
  <div class="meta" id="meta"></div>
  <ol id="list"></ol>
  <div class="empty" id="empty" hidden>暂无数据</div>
  <div class="err" id="err" hidden></div>
</main>
<script>
(function(){
  var state={data:null,cur:null};
  var tabsEl=document.getElementById('tabs'),subsEl=document.getElementById('subs'),subs2El=document.getElementById('subs2'),listEl=document.getElementById('list'),
      metaEl=document.getElementById('meta'),updEl=document.getElementById('updated'),
      emptyEl=document.getElementById('empty'),errEl=document.getElementById('err');

  function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : null; }
  function fmtHot(h){
    var n=Number(h); if(!isFinite(n)||h===null||h==='') return '';
    if(n>=1e8) return (n/1e8).toFixed(1)+' 亿';
    if(n>=1e4) return (n/1e4).toFixed(1)+' 万';
    return String(n);
  }
  function ago(ts){
    var t=new Date(ts.replace(' ','T')+'+08:00').getTime(), m=Math.round((Date.now()-t)/60000);
    if(isNaN(m)) return ts;
    if(m<1) return '刚刚'; if(m<60) return m+' 分钟前';
    var h=Math.floor(m/60); if(h<24) return h+' 小时前';
    return Math.floor(h/24)+' 天前';
  }
  function sites(){
    var order=[],map={};
    state.data.sources.forEach(function(s){
      var k=s.site||s.label;
      if(!map[k]){map[k]=[];order.push(k);}
      map[k].push(s);
    });
    return {order:order,map:map};
  }
  function renderTabs(){
    var g=sites(), curSrc=state.data.sources.filter(function(x){return x.id===state.cur;})[0];
    var curSite=curSrc?(curSrc.site||curSrc.label):g.order[0];
    tabsEl.textContent='';subsEl.textContent='';subs2El.textContent='';
    g.order.forEach(function(k){
      var b=document.createElement('button');
      b.className='tab'+(k===curSite?' on':''); b.textContent=k;
      b.onclick=function(){state.cur=g.map[k][0].id;renderTabs();renderList();};
      tabsEl.appendChild(b);
    });
    var list=g.map[curSite]||[];
    var subOrder=[],subMap={};
    list.forEach(function(s){var k=s.sub||s.label; if(!subMap[k]){subMap[k]=[];subOrder.push(k);} subMap[k].push(s);});
    var curSub=curSrc?(curSrc.sub||curSrc.label):subOrder[0];
    if(subOrder.length>1){
      subOrder.forEach(function(k){
        var b=document.createElement('button');
        b.className='sub-tab'+(k===curSub?' on':''); b.textContent=k;
        b.onclick=function(){state.cur=subMap[k][0].id;renderTabs();renderList();};
        subsEl.appendChild(b);
      });
    }
    var l2=subMap[curSub]||[];
    if(l2.length>1){
      l2.forEach(function(s){
        var b=document.createElement('button');
        b.className='sub-tab'+(s.id===state.cur?' on':''); b.textContent=s.sub2||s.label;
        b.onclick=function(){state.cur=s.id;renderTabs();renderList();};
        subs2El.appendChild(b);
      });
    }
  }
  function renderList(){
    var s=state.data.sources.filter(function(x){return x.id===state.cur;})[0];
    listEl.textContent=''; emptyEl.hidden=true;
    if(!s||!s.items.length){emptyEl.hidden=false;metaEl.textContent='';return;}
    metaEl.textContent='本榜单采集于 '+s.captured_at+'（'+ago(s.captured_at)+'），共 '+s.items.length+' 条'+(s.rank_date?'；榜单日期 '+s.rank_date.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'):'');
    var fmtPct=function(v){return (v>0?'+':'')+Number(v).toFixed(2)+'%';};
    var cls=function(v){return v>0?'up':(v<0?'dn':'');};
    var link=function(txt,url,cn){var u=safeUrl(url),e=document.createElement(u?'a':'span');if(cn)e.className=cn;e.textContent=txt;if(u){e.href=u;e.target='_blank';e.rel='noopener noreferrer';}return e;};
    s.items.forEach(function(it,i){
      var ex=it.extra, li=document.createElement('li');
      if(it.rank!=null) li.className='ranked'+(ex?' rich':'');
      var rk=document.createElement('div');rk.className='rk r'+(it.rank!=null&&it.rank<=3?it.rank:'n');
      rk.textContent=it.rank!=null?it.rank:'·';
      var bd=document.createElement('div');bd.className='bd';
      var hd=document.createElement('div');hd.className='hd';
      var nm=document.createElement('div');nm.className='nm';
      var title=it.title, code=null, m=/^(.*?)\(([A-Za-z0-9.]+)\)$/.exec(title||'');
      if(ex&&m){title=m[1];code=m[2];}
      nm.appendChild(link(title,it.url,'nmt'));
      if(it.new){var nb=document.createElement('span');nb.className='badge';nb.textContent='新';nm.appendChild(nb);}
      if(code){var cd=document.createElement('div');cd.className='cd';cd.textContent=code;nm.appendChild(cd);}
      if(ex&&ex.limitup){var lu=document.createElement('span');lu.className='lu';lu.textContent=ex.limitup+'家涨停';nm.appendChild(lu);}
      hd.appendChild(nm);
      if(ex&&(ex.pct!=null||ex.price!=null)){
        var rc=document.createElement('div');rc.className='rc';
        if(ex.pct!=null){var p=document.createElement('div');p.className='pc '+cls(ex.pct);p.textContent=fmtPct(ex.pct);rc.appendChild(p);}
        if(ex.price!=null){var pr=document.createElement('div');pr.className='pr';pr.textContent=ex.price;rc.appendChild(pr);}
        hd.appendChild(rc);
      }
      if(ex&&ex.leader&&ex.leader.name){
        var ld=document.createElement('div');ld.className='ld';
        var l1=document.createElement('div');l1.textContent=ex.leader.name;ld.appendChild(l1);
        if(ex.leader.pct!=null){var l2=document.createElement('div');l2.className='pc '+cls(ex.leader.pct);l2.textContent=fmtPct(ex.leader.pct);ld.appendChild(l2);}
        hd.appendChild(ld);
      }
      bd.appendChild(hd);
      if(ex&&ex.tags&&ex.tags.length){
        var cs=document.createElement('div');cs.className='chips';
        ex.tags.forEach(function(t){var c=document.createElement('span');c.className='chip'+(t.k==='feat'?' feat':'');c.textContent=t.t;cs.appendChild(c);});
        bd.appendChild(cs);
      }
      if(ex&&ex.note){var nn=document.createElement('div');nn.className='sub';nn.textContent=ex.note;bd.appendChild(nn);}
      if(ex&&ex.news&&(ex.news.title||ex.news.summary)){
        var nw=link('',ex.news.url||it.url,'news');
        var b2=document.createElement('b');b2.textContent=ex.news.label||'热点';nw.appendChild(b2);
        if(ex.news.title){var nt=document.createElement('span');nt.className='nt';nt.textContent=ex.news.title;nw.appendChild(nt);}
        if(ex.news.summary){var sm=document.createElement('div');sm.className='sm';sm.textContent=ex.news.summary;nw.appendChild(sm);}
        bd.appendChild(nw);
      }
      if(!ex){
        var parts=[]; var h2=fmtHot(it.hot); if(h2) parts.push('热度 '+h2);
        if(it.pub) parts.push('发布 '+it.pub.slice(5,16)); else if(it.first_seen) parts.push('采集到 '+it.first_seen.slice(5,16));
        if(parts.length){var sub=document.createElement('div');sub.className='sub';sub.textContent=parts.join(' · ');bd.appendChild(sub);}
      }
      li.appendChild(rk);li.appendChild(bd);listEl.appendChild(li);
    });
  }
  function load(){
    fetch('latest.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
    }).then(function(d){
      state.data=d; errEl.hidden=true;
      if(!d.sources||!d.sources.length){updEl.textContent='';emptyEl.hidden=false;return;}
      if(!state.cur||!d.sources.some(function(s){return s.id===state.cur;})) state.cur=d.sources[0].id;
      updEl.textContent='数据生成于 '+d.generated_at;
      renderTabs();renderList();
    }).catch(function(e){
      errEl.hidden=false; errEl.textContent='数据加载失败：'+e.message;
    });
  }
  load(); setInterval(load,60000);
})();
</script>
</body>
</html>
